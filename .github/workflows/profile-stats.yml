name: Refresh profile intelligence

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch live GitHub and LeetCode data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, os
          from pathlib import Path
          USER="sangamsingh18"; LC="sangam__singh_"
          def get(url, headers):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
          h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"]}
          u=get(f"https://api.github.com/users/{USER}",h)
          repos=get(f"https://api.github.com/users/{USER}/repos?per_page=100&sort=updated",h)
          public_repos=u.get("public_repos",len(repos))
          stars=sum(x.get("stargazers_count",0) for x in repos if not x.get("fork"))
          forks=sum(x.get("forks_count",0) for x in repos if not x.get("fork"))
          followers=u.get("followers",0)
          now=datetime.datetime.utcnow(); start=(now-datetime.timedelta(days=365)).strftime("%Y-%m-%dT00:00:00Z"); end=now.strftime("%Y-%m-%dT23:59:59Z")
          q='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount color weekday}}}}}}'
          body=json.dumps({"query":q,"variables":{"login":USER,"from":start,"to":end}}).encode()
          req=urllib.request.Request("https://api.github.com/graphql",data=body,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r: gh=json.load(r)
          cal=gh["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          lq='query($username:String!){matchedUser(username:$username){submitStatsGlobal{acSubmissionNum{difficulty count submissions}}profile{ranking}}userContestRanking(username:$username){rating globalRanking topPercentage attendedContestsCount}}'
          body=json.dumps({"query":lq,"variables":{"username":LC}}).encode()
          req=urllib.request.Request("https://leetcode.com/graphql",data=body,headers={"Content-Type":"application/json","Origin":"https://leetcode.com","Referer":"https://leetcode.com/"})
          with urllib.request.urlopen(req,timeout=30) as r: lc=json.load(r)
          m=(lc.get("data") or {}).get("matchedUser") or {}
          solved={x["difficulty"]:x["count"] for x in (m.get("submitStatsGlobal") or {}).get("acSubmissionNum",[])}
          contest=(lc.get("data") or {}).get("userContestRanking") or {}
          data={"github":{"repos":public_repos,"stars":stars,"forks":forks,"followers":followers,"contributions":cal["totalContributions"]},"leetcode":{"solved":sum(solved.values()),"easy":solved.get("EASY",0),"medium":solved.get("MEDIUM",0),"hard":solved.get("HARD",0),"rating":round(contest.get("rating",0)),"rank":contest.get("globalRanking",0),"top":contest.get("topPercentage",0)}}
          Path("profile-stats.json").write_text(json.dumps(data,indent=2))
          p=Path("id-dashboard.svg"); s=p.read_text()
          s=s.replace(">28</text>",f">{public_repos}</text>",1).replace(">3</text>",f">{stars}</text>",1).replace(">0</text>",f">{forks}</text>",1).replace(">LIVE</text>",f">{followers}</text>",1)
          s=s.replace(">600+</text>",f">{data['leetcode']['solved']}</text>",1).replace(">1700+</text>",f">{data['leetcode']['rating']}</text>",1)
          p.write_text(s)
          p=Path("leetcode.svg"); s=p.read_text()
          cells=[]
          for ci,w in enumerate(cal["weeks"][-53:]):
              for d in w["contributionDays"]:
                  cells.append(f'<rect x="{24+ci*20}" y="{50+d.get("weekday",0)*25}" width="15" height="19" rx="4" fill="{d.get("color","#182236")}"><title>{d["date"]}: {d["contributionCount"]} contributions</title></rect>')
          marker='<text x="24" y="254"'
          s=s.replace(marker,"".join(cells)+marker)
          s=s.replace(">600+</text>",f">{data['leetcode']['solved']}</text>").replace(">1700+</text>",f">{data['leetcode']['rating']}</text>")
          p.write_text(s)
          PY
      - name: Commit refreshed profile data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add id-dashboard.svg leetcode.svg profile-stats.json
          git commit -m "refresh live profile stats" || exit 0
          git push
